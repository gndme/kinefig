name: CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: Test & Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest toml

      - name: Run Unit Tests (Pytest)
        run: |
          python -m pytest -v

      - name: Build Extension Package
        run: |
          python scripts/build_extension.py

      - name: Verify Extension Package Structure
        run: |
          python -c "
          import zipfile
          with zipfile.ZipFile('dist/kinefig-0.0.1.zip', 'r') as z:
              files = z.namelist()
              assert 'blender_manifest.toml' in files, 'Manifest missing from zip root'
              assert '__init__.py' in files, '__init__.py missing from zip root'
              print('Package verification passed. Total files:', len(files))
          "

      - name: Install Blender 4.2
        if: matrix.python-version == '3.11'
        run: |
          BLENDER_URL="https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
          mkdir -p $HOME/blender
          curl -sSL $BLENDER_URL | tar -xJ -C $HOME/blender --strip-components=1
          echo "$HOME/blender" >> $GITHUB_PATH

      - name: Official Blender Extension Validation
        if: matrix.python-version == '3.11'
        run: |
          blender --version
          blender --command extension validate dist/kinefig-0.0.1.zip

      - name: Real Blender Runtime Integration Test
        if: matrix.python-version == '3.11'
        run: |
          blender --background --factory-startup --python tests/test_blender_runtime.py

      - name: Upload Extension Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: kinefig-extension
          path: dist/kinefig-*.zip
